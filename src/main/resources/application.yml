app:
  jwt:
    # 256位安全密钥 (32字节)
    secret: MySecureJwtSecretKeyForSocialNetworkDemo2025WithMinimum256BitsLength
    expirationMs: 3600000  # 1小时 (毫秒)

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/social_network?useSSL=false&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
file:
  upload:
    path: ./uploads
    max-size: 104857600 # 100MB
  storage:
    threshold: 90            # 存储空间使用率阈值(%)